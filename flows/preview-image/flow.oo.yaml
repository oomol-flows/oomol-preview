nodes:
  - task: self::image_preview
    title: "%image-preview-12%"
    node_id: image-preview#2
    inputs_from:
      - handle: image_path
        from_node:
          - node_id: url_to_file#1
            output_handle: file_path
  - task: oomol-file::url_to_file
    title: "%url-to-file-15%"
    node_id: url_to_file#1
    inputs_from:
      - handle: url
        value: https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/GOODSMILE_Racing_Komatti-Mirai_EV_TT_Zero.jpg/2880px-GOODSMILE_Racing_Komatti-Mirai_EV_TT_Zero.jpg
      - handle: query
        value:
          {}
      - handle: headers
        value:
          {}
      - handle: timeout
        value: 0
      - handle: retry_times
        value: 1
      - handle: reset_filename
        value: true
  - task: oomol-file::file_to_binary
    title: "%file-to-binary-12%"
    node_id: file_to_binary#1
    inputs_from:
      - handle: file_path
        from_node:
          - node_id: url_to_file#1
            output_handle: file_path
  - task: self::binary_image_preview
    title: "%binary-image-preview-12%"
    node_id: binary_image_preview#1
    inputs_from:
      - handle: binary
        from_node:
          - node_id: file_to_binary#1
            output_handle: binary
  - task:
      ui:
        default_width: 450
      inputs_def:
        - handle: file
          description: "%single-file-path-input%"
          json_schema:
            type: string
            ui:widget: file
      outputs_def:
        - handle: files
          description: Array of file paths output
          json_schema:
            type: array
            items:
              type: string
              ui:widget: file
      executor:
        name: nodejs
        options:
          entry: scriptlets/+typescript#1.ts
      description: Convert a single file path to an array of file paths
    title: "%file-to-list2%"
    icon: ":skill-icons:typescript:"
    node_id: +typescript#1
    inputs_from:
      - handle: file
        from_node:
          - node_id: url_to_file#1
            output_handle: file_path
