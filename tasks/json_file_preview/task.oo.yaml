ui:
  default_width: 450
inputs_def:
  - handle: jsonPath
    description: "%path-to-the-json-file-to-preview%"
    json_schema:
      type: string
      ui:widget: file
      ui:options:
        filters:
          - name: JSON
            extensions:
              - json
              - jsonc
              - json5
              - geojson
              - geo.json
outputs_def:
  []
executor:
  name: nodejs
  options:
    entry: main.ts
    spawn: false
title: "%json-file-preview2%"
icon: ":carbon:json:"
description: "%display-and-preview-json-file-content-with-syntax-highlighting%"
