inputs_def:
  - handle: audio_path
    description: Path to the audio file to preview
    json_schema:
      type: string
      ui:widget: file
      ui:options:
        excludeAll: false
        filters:
          - name: MP3
            extensions:
              - mp3
          - name: MP4
            extensions:
              - m4a
              - mp4
          - name: WAV
            extensions:
              - wav
              - wave
          - name: WebM
            extensions:
              - weba
              - webm
          - name: FLAC
            extensions:
              - flac
              - fla
          - name: Opus
            extensions:
              - opus
              - oga
              - ogg
          - name: PCM
            extensions:
              - pcm
              - raw
              - snd
          - name: Vorbis
            extensions:
              - ogg
              - oga
          - name: AAC
            extensions:
              - aac
outputs_def:
  []
ui:
  default_width: 450
executor:
  name: nodejs
  options:
    entry: index.ts
    spawn: false
title: Audio preview
icon: ":carbon:document-audio:"
description: Display and preview audio files in various formats including MP3,
  MP4, WAV, WebM, FLAC, Opus, PCM, Vorbis, and AAC
